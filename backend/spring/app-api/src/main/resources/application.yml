spring:
  application:
    name: chatsito-api-spring
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/social}
      auto-index-creation: true

server:
  port: ${API_HTTP_PORT:5000}

legacy:
  jwt:
    secret: ${JWT_SECRET:}
    algorithm: ${JWT_ALGORITHM:HS256}
  notification-grpc:
    host: ${GRPC_NOTIFY_HOST:localhost}
    port: ${NOTIFICATION_GRPC_PORT:8090}
  chat-grpc:
    port: ${CHAT_GRPC_PORT:5001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
